name: Build Windows Installer

# Builds the Windows x64 NSIS installer on a real windows-latest runner.
#
# Why this workflow compiles `printer` by hand instead of letting npm/
# electron-builder do it automatically:
#
# 1. The pinned tojocky/node-printer commit does NOT declare node-gyp as
#    its own dependency (checked its package.json directly) -- its
#    install script ("prebuild-install || node-gyp rebuild") falls back
#    to whatever node-gyp is ambient on the machine. On GitHub's
#    windows-latest image that resolved to node-gyp@6.1.0, whose Visual
#    Studio detector predates the runner's VS major version
#    ("Visual Studio\18\Enterprise") and fails with
#    "find VS unknown version 'undefined'" before compilation even
#    starts.
# 2. electron-builder's own packaging step *also* runs an automatic
#    native-module rebuild pass by default before packaging
#    (app-builder-lib's Packager.installAppDependencies, gated on
#    `npmRebuild !== false`) -- confirmed by reading its source. That
#    pass doesn't pin a modern node-gyp either, so left enabled it could
#    silently redo the same broken rebuild and clobber a correctly
#    compiled binary. package.json now sets `"npmRebuild": false`.
#
# So the strategy is: install without running ANY lifecycle scripts
# (`npm ci --ignore-scripts`), then explicitly compile printer ourselves
# using a modern node-gyp we pin as our own devDependency
# ("node-gyp": "^13.0.2"), targeted directly at Electron 31's ABI via
# node-gyp's own --target/--arch/--dist-url/--runtime flags -- the same
# parameters electron-builder's own rebuild path sets internally
# (npm_config_target / npm_config_disturl=https://electronjs.org/headers
# / npm_config_runtime=electron), just under our explicit control.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "scripts/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Informational only -- never fails the job. Shows what's actually
      # on the runner, including the fact that VS is present (this was
      # never really in question -- old node-gyp just couldn't see it).
      - name: Report build tooling present on this runner
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "--- node / npm ---"
          node -v
          npm -v
          Write-Host "--- python ---"
          python --version
          where.exe python
          Write-Host "--- Visual Studio / MSVC (via vswhere) ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            Write-Host "vswhere.exe not found at expected path"
          }
          Write-Host "--- ambient node-gyp note ---"
          Write-Host "The legacy path (printer's own install script, or a plain 'npm rebuild') resolves node-gyp@6.1.0 on this runner, whose VS detector predates this image's Visual Studio major version. We do not rely on that copy -- see the explicit compile step below, which uses this project's own pinned devDependency instead."

      # --ignore-scripts is the key change: it installs every package's
      # files WITHOUT running any lifecycle script. That means printer's
      # own broken "prebuild-install || node-gyp rebuild" install script
      # never runs here (so it can't fail the whole install), and our own
      # top-level "postinstall": "electron-builder install-app-deps"
      # doesn't run prematurely either -- we call the real compile step
      # explicitly, below, in full view.
      - name: Install dependencies (npm ci --ignore-scripts)
        run: npm ci --ignore-scripts

      - name: Confirm our pinned modern node-gyp
        run: npx --no-install node-gyp --version

      # This is the actual fix: compile printer directly against
      # Electron 31's ABI using OUR pinned node-gyp (^13.0.2), not
      # whatever ambient copy the runner or printer's own install script
      # would otherwise reach for. --target/--dist-url/--runtime mirror
      # exactly what electron-builder's own rebuild path sets via
      # npm_config_target / npm_config_disturl / npm_config_runtime
      # (verified in app-builder-lib's util/yarn.js).
      - name: Compile printer for Electron 31 (explicit modern node-gyp)
        run: |
          set -euo pipefail
          if [ ! -d node_modules/printer ]; then
            echo "::error::node_modules/printer does not exist after npm ci --ignore-scripts. That step only extracts package files without running scripts, so this means the dependency itself failed to resolve/download -- check the 'Install dependencies' step's log."
            exit 1
          fi

          ELECTRON_VERSION="$(node -p "require('./node_modules/electron/package.json').version")"
          echo "Target Electron version: $ELECTRON_VERSION"

          NODE_GYP_BIN="$(pwd)/node_modules/.bin/node-gyp"
          echo "Using node-gyp: $NODE_GYP_BIN ($("$NODE_GYP_BIN" --version))"

          (
            cd node_modules/printer
            "$NODE_GYP_BIN" rebuild \
              --target="$ELECTRON_VERSION" \
              --arch=x64 \
              --dist-url=https://electronjs.org/headers \
              --runtime=electron \
              --verbose
          )

          # Safety net: printer's binding.gyp has an "action_after_build"
          # target that copies build/Release/node_printer.node to
          # lib/node_printer.node (lib/printer.js requires it from there,
          # not from build/Release/ directly). `node-gyp rebuild` with no
          # explicit target should run gyp's default target and perform
          # this copy, but we don't rely on that implicitly -- we verify
          # and, if needed, do it ourselves so a require('printer') can
          # never fail purely because of a missed copy step.
          if [ ! -f node_modules/printer/lib/node_printer.node ]; then
            echo "lib/node_printer.node missing after rebuild -- copying explicitly from build/Release/"
            cp node_modules/printer/build/Release/node_printer.node node_modules/printer/lib/node_printer.node
          fi

      # Requirement: exact PowerShell diagnostics of the compiled state.
      - name: Diagnose node_modules/printer state
        if: always()
        shell: pwsh
        run: |
          $exists = Test-Path node_modules/printer
          Write-Host "Test-Path node_modules/printer => $exists"
          if ($exists) {
            Write-Host "--- Get-ChildItem node_modules/printer -Recurse ---"
            Get-ChildItem node_modules/printer -Recurse | Select-Object FullName, Length
            Write-Host "--- Searching node_modules/printer for *.node ---"
            $nodeFiles = Get-ChildItem node_modules/printer -Recurse -Filter *.node -ErrorAction SilentlyContinue
            if ($nodeFiles) {
              $nodeFiles | ForEach-Object { Write-Host $_.FullName }
            } else {
              Write-Host "No *.node files found under node_modules/printer."
            }
          } else {
            Write-Host "node_modules/printer does not exist."
          }

      - name: Compile TypeScript
        run: npm run build

      # Gate A -- require/loading gate.
      - name: "Gate A: require('printer') under Electron's ABI"
        run: |
          set -euo pipefail
          if [ ! -f node_modules/printer/lib/node_printer.node ]; then
            echo "::error::node_modules/printer/lib/node_printer.node does not exist -- the compile step above did not produce it. See its log."
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 npx --no-install electron -e "
            try {
              const p = require('printer');
              console.log('OK: printer module loaded under Electron ABI. Exports:', Object.keys(p).join(', '));
            } catch (e) {
              console.error('FAIL: printer module did not load under Electron\\'s ABI:');
              console.error(e.stack);
              process.exit(1);
            }
          "

      - name: Build Windows x64 NSIS installer
        run: npm run build:win

      # Gate B -- packaging gate.
      - name: "Gate B: packaged app contains the native .node binary"
        run: |
          set -euo pipefail
          echo "Searching release/ for packaged *.node files..."
          NODE_FILES="$(find release -iname '*.node' 2>/dev/null || true)"
          if [ -z "$NODE_FILES" ]; then
            echo "::error::No .node native module files found anywhere under release/ after packaging. Failing this workflow on purpose."
            echo "---- Full release/ contents, for debugging ----"
            find release -type f | sort || true
            exit 1
          fi
          echo "Found packaged .node file(s):"
          echo "$NODE_FILES"

      - name: Show installer output
        run: find release -maxdepth 1 -iname "*.exe" -exec ls -la {} \;

      - name: Upload Windows installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mero-restro-print-agent-windows-installer
          path: release/*.exe
          if-no-files-found: error
