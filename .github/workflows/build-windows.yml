name: Build Windows Installer

# Builds the Windows x64 NSIS installer on a real windows-latest runner so
# the "printer" native module (raw USB printing via the Win32 spooler) is
# actually compiled and rebuilt against Electron's ABI.
#
# IMPORTANT: "printer" was moved from optionalDependencies to
# dependencies (see package.json) specifically so npm CANNOT silently
# swallow an install/compile failure the way it did before -- with
# optionalDependencies, npm treats a network failure, missing build
# tooling, and a genuine C++ compile error identically: it quietly
# removes the partially-installed folder and reports success. As a
# required dependency, the same failure now makes `npm ci` itself exit
# non-zero, with --foreground-scripts streaming the real
# prebuild-install/node-gyp/MSBuild/compiler output directly into this
# log instead of hiding it in an npm debug file.
#
# This is a deliberately temporary state for diagnosis. Once a Windows
# build is green, printer can go back into optionalDependencies if you
# don't want a Mac-only `npm install` ever blocked by a Windows-only
# native module (it isn't currently used on macOS -- CUPS `lp` is used
# there instead).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "scripts/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Informational only -- confirms what's actually on this runner
      # before we blame the toolchain for anything. Does not install
      # anything and never fails the job.
      - name: Report build tooling present on this runner
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "--- node / npm ---"
          node -v
          npm -v
          Write-Host "--- python ---"
          python --version
          where.exe python
          Write-Host "--- Visual Studio / MSVC (via vswhere) ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            Write-Host "vswhere.exe not found at expected path"
          }
          Write-Host "--- node-gyp (as npm would invoke it) ---"
          npx --yes node-gyp --version

      # printer is now a REQUIRED dependency (see comment above), and
      # --foreground-scripts streams every package's install-script
      # output live instead of only summarizing pass/fail. If
      # prebuild-install and node-gyp both fail for printer, this step
      # fails the job right here, with the real error visible above.
      - name: Install dependencies (npm ci --foreground-scripts)
        run: npm ci --foreground-scripts --verbose

      # Requirement: exact PowerShell diagnostics, always run (even if
      # the step above already failed) so we can see exactly what state
      # node_modules/printer was left in.
      - name: Diagnose node_modules/printer state
        if: always()
        shell: pwsh
        run: |
          $exists = Test-Path node_modules/printer
          Write-Host "Test-Path node_modules/printer => $exists"
          if ($exists) {
            Write-Host "--- Get-ChildItem node_modules/printer -Recurse ---"
            Get-ChildItem node_modules/printer -Recurse | Select-Object FullName, Length
            Write-Host "--- Searching node_modules/printer for *.node ---"
            $nodeFiles = Get-ChildItem node_modules/printer -Recurse -Filter *.node -ErrorAction SilentlyContinue
            if ($nodeFiles) {
              $nodeFiles | ForEach-Object { Write-Host $_.FullName }
            } else {
              Write-Host "No *.node files found under node_modules/printer."
            }
          } else {
            Write-Host "node_modules/printer does not exist -- npm ci already failed/removed it. See the 'Install dependencies' step's log above for the real prebuild-install/node-gyp/MSBuild error."
          }

      # Isolated, single-package re-run of printer's own install script
      # with maximum verbosity, per the requested diagnostic strategy.
      # If npm ci above already failed, node_modules/printer won't
      # exist -- skip cleanly here rather than emitting a second,
      # confusing "no such package" error; the real failure is already
      # visible in the "Install dependencies" step.
      - name: Explicit printer rebuild (foreground-scripts, verbose)
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d node_modules/printer ]; then
            echo "::warning::node_modules/printer does not exist -- skipping the isolated rebuild (npm ci already failed on it; see that step's log)."
            exit 0
          fi
          npm rebuild printer --foreground-scripts --verbose

      - name: Compile TypeScript
        run: npm run build

      # Gate A -- require/loading gate: prove printer.node actually
      # matches Electron 31's ABI, not just plain Node 20's, by loading
      # it inside Electron's own Node runtime (ELECTRON_RUN_AS_NODE runs
      # Electron headlessly, no window).
      - name: "Gate A: require('printer') under Electron's ABI"
        run: |
          set -euo pipefail
          if [ ! -d node_modules/printer ]; then
            echo "::error::node_modules/printer does not exist -- cannot even attempt to load it. See the 'Install dependencies' step's log for the real error."
            exit 1
          fi
          ELECTRON_RUN_AS_NODE=1 npx --no-install electron -e "
            try {
              const p = require('printer');
              console.log('OK: printer module loaded under Electron ABI. Exports:', Object.keys(p).join(', '));
            } catch (e) {
              console.error('FAIL: printer module did not load under Electron\\'s ABI:');
              console.error(e.stack);
              process.exit(1);
            }
          "

      - name: Build Windows x64 NSIS installer
        run: npm run build:win

      # Gate B -- packaging gate: even if the module loaded fine above,
      # a misconfigured asarUnpack/files filter could still leave it out
      # of the actual shipped app.
      - name: "Gate B: packaged app contains the native .node binary"
        run: |
          set -euo pipefail
          echo "Searching release/ for packaged *.node files..."
          NODE_FILES="$(find release -iname '*.node' 2>/dev/null || true)"
          if [ -z "$NODE_FILES" ]; then
            echo "::error::No .node native module files found anywhere under release/ after packaging. Failing this workflow on purpose -- an .exe without the native printing component is not a successful build."
            echo "---- Full release/ contents, for debugging ----"
            find release -type f | sort || true
            exit 1
          fi
          echo "Found packaged .node file(s):"
          echo "$NODE_FILES"

      - name: Show installer output
        run: find release -maxdepth 1 -iname "*.exe" -exec ls -la {} \;

      - name: Upload Windows installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mero-restro-print-agent-windows-installer
          path: release/*.exe
          if-no-files-found: error
